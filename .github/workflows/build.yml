
name: SecureLLM CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test and SDD Check
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------
      # Repository Check
      # --------------------------------
      - name: Repository check
        run: |
          echo "Starting SecureLLM CI..."
          echo "Repository checkout successful."

      # --------------------------------
      # Setup Python
      # --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      # --------------------------------
      # Install Dependencies
      # --------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |
          if [ -f api-gateway/requirements.txt ]; then
            python -m pip install -r api-gateway/requirements.txt
          else
            echo "API gateway requirements file is missing."
            exit 1
          fi

      # --------------------------------
      # Run Tests
      # --------------------------------
      - name: Run tests
        shell: bash
        env:
          PYTHONPATH: api-gateway
        run: |
          if [ -d tests ]; then
            python -m pytest tests
          else
            echo "Tests directory is missing."
            exit 1
          fi

      # --------------------------------
      # SDD Check
      # --------------------------------
      - name: Check SDD documentation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Checking for required SDD changes..."

          git fetch origin main

          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          SDD_CHANGED=$(echo "$CHANGED_FILES" | grep '^specs/.*\.md$' || true)

          if [ -z "$SDD_CHANGED" ]; then
            echo ""
            echo "ERROR: No SDD update detected."
            echo ""
            echo "Every project change must include an update to the specs/ directory."
            echo ""
            echo "Please:"
            echo "1. Update the relevant SDD .md file"
            echo "2. Commit the change"
            echo "3. Push your branch again"
            echo ""
            exit 1
          fi

          echo ""
          echo "SDD update detected:"
          echo "$SDD_CHANGED"
          echo ""
          echo "SDD check passed."

      # --------------------------------
      # CI Completed
      # --------------------------------
      - name: CI completed
        run: |
          echo "SecureLLM CI completed successfully."

