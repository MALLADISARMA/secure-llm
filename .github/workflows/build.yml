
name: SecureLLM CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test and SDD Check
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------
      # Repository Check
      # --------------------------------
      - name: Repository check
        run: |
          echo "Starting SecureLLM CI..."
          echo "Repository checkout successful."
          test -f api-gateway/requirements.txt
          test -d api-gateway/app
          test -d tests
          test -f frontend/package.json
          test -f frontend/package-lock.json
          test -d frontend/src
          test -f run.ps1
          test -f llm-service/requirements.txt
          test -f llm-service/Dockerfile
          test -f llm-service/app/main.py
          test -d specs

      # --------------------------------
      # Setup Python
      # --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      # --------------------------------
      # Install Dependencies
      # --------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api-gateway/requirements.txt
          python -m pip install -r llm-service/requirements.txt

      # --------------------------------
      # Run Tests
      # --------------------------------
      - name: Run tests
        shell: bash
        env:
          PYTHONPATH: api-gateway
        run: |
          python -m pytest -q tests

      - name: Check Python syntax
        shell: bash
        env:
          PYTHONPATH: api-gateway
        run: python -m compileall -q api-gateway/app llm-service/app tests

      - name: Validate local launcher contract
        shell: bash
        run: |
          grep -Fq 'Start-Process $pythonExecutable' run.ps1
          grep -Fq 'Start-Process $npmExecutable' run.ps1
          grep -Fq -- '-WindowStyle Hidden' run.ps1
          grep -Fq -- '-RedirectStandardOutput $apiOutputLog' run.ps1
          grep -Fq -- '-RedirectStandardError $frontendErrorLog' run.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # --------------------------------
      # SDD Check
      # --------------------------------
      - name: Check SDD documentation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Checking for required SDD changes..."

          git fetch origin main

          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          SDD_CHANGED=$(echo "$CHANGED_FILES" | grep '^specs/.*\.md$' || true)

          if [ -z "$SDD_CHANGED" ]; then
            echo ""
            echo "ERROR: No SDD update detected."
            echo ""
            echo "Every project change must include an update to the specs/ directory."
            echo ""
            echo "Please:"
            echo "1. Update the relevant SDD .md file"
            echo "2. Commit the change"
            echo "3. Push your branch again"
            echo ""
            exit 1
          fi

          echo ""
          echo "SDD update detected:"
          echo "$SDD_CHANGED"
          echo ""
          echo "SDD check passed."

      # --------------------------------
      # CI Completed
      # --------------------------------
      - name: CI completed
        run: |
          echo "SecureLLM CI completed successfully."

