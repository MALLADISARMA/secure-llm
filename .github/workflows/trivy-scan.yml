name: SecureLLM Trivy Scan

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    name: Weekly filesystem vulnerability scan
    runs-on: ubuntu-latest

    steps:
      # Check out the complete repository for filesystem scanning.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the latest stable Trivy release using Aqua Security's setup action.
      - name: Set up latest Trivy
        id: setup-trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      # Findings are uploaded to GitHub Code Security without failing the scan.
      - name: Scan repository for vulnerabilities
        id: trivy-scan
        run: trivy fs --scanners vuln --exit-code 0 --format sarif --output trivy-results.sarif .

      - name: Upload findings to GitHub Code Security
        if: steps.trivy-scan.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
